name: Build & Push Docker image (GHCR)

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ปลายทางที่ต้องการ: ghcr.io/kanlayarat/69-s3-app
  # หมายเหตุ: GITHUB_TOKEN push ข้าม namespace ไม่ได้
  #           ต้องตั้ง repo secret ชื่อ GHCR_TOKEN = PAT ของบัญชี kanlayarat (scope: write:packages)
  #           ถ้าไม่ได้ตั้ง จะ fallback ไปใช้ GITHUB_TOKEN (push ได้แค่ namespace ของ repo เอง)
  IMAGE_NAME: kanlayarat/69-s3-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GHCR_TOKEN secret
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "::error::ไม่พบ secret ชื่อ GHCR_TOKEN (หรือตั้งเป็น Variable แทน Secret)"
            echo "ให้เพิ่มที่: Settings > Secrets and variables > Actions > Secrets > New repository secret"
            echo "และ PAT ต้องเป็น classic token ของบัญชี kanlayarat + scope write:packages"
            exit 1
          fi
          echo "พบ secret GHCR_TOKEN แล้ว"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: kanlayarat
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
