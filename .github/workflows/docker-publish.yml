name: Build & Push Docker image (GHCR)

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ปลายทาง: ghcr.io/kanlayarat-y-coder/69-s3-app (namespace เดียวกับเจ้าของ repo)
  # ใช้ GITHUB_TOKEN ของ workflow push ได้เลย จึงไม่ต้องตั้ง PAT/secret เพิ่ม
  IMAGE_NAME: kanlayarat-y-coder/69-s3-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
